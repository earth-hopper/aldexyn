<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAPAN FREERIDE RANKINGS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#bc002d',
          }
        }
      }
    }
  </script>
  <style>
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-white text-neutral-900 min-h-screen antialiased flex flex-col justify-between">

  <!-- ヘッダー -->
  <header class="border-b-2 border-black bg-white">
    <div class="max-w-6xl mx-auto px-4 py-6 sm:px-6">
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
        <div>
          <div class="inline-block bg-brand text-white text-xs font-bold tracking-widest px-2 py-0.5 uppercase mb-2">
            Official Standings
          </div>
          <h1 class="text-2xl sm:text-3xl font-black tracking-tight uppercase text-black">
            Japan Freeride Rankings
          </h1>
        </div>
        <div class="text-xs text-neutral-500 font-mono">
          最終更新: <span id="last-updated" class="font-bold text-neutral-800">取得中...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl mx-auto px-4 py-8 sm:px-6 flex-1 w-full">
    
    <!-- 種目切り替えタブ -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-8" id="category-tabs">
      <button onclick="changeCategory('ski_men')" id="tab-ski_men" class="tab-btn px-4 py-3 text-xs sm:text-sm font-bold tracking-wider uppercase border border-black transition-colors text-center">
        Ski Men
      </button>
      <button onclick="changeCategory('ski_women')" id="tab-ski_women" class="tab-btn px-4 py-3 text-xs sm:text-sm font-bold tracking-wider uppercase border border-black transition-colors text-center">
        Ski Women
      </button>
      <button onclick="changeCategory('snowboard_men')" id="tab-snowboard_men" class="tab-btn px-4 py-3 text-xs sm:text-sm font-bold tracking-wider uppercase border border-black transition-colors text-center">
        Snowboard Men
      </button>
      <button onclick="changeCategory('snowboard_women')" id="tab-snowboard_women" class="tab-btn px-4 py-3 text-xs sm:text-sm font-bold tracking-wider uppercase border border-black transition-colors text-center">
        Snowboard Women
      </button>
    </div>

    <!-- ランキングテーブル -->
    <div class="border border-black bg-white">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-black text-white text-xs font-mono tracking-wider uppercase border-b border-black">
              <th scope="col" class="py-3.5 px-4 w-16 text-center">JP</th>
              <th scope="col" class="py-3.5 px-4 w-20 text-center">World</th>
              <th scope="col" class="py-3.5 px-4">Athlete</th>
              <th scope="col" class="py-3.5 px-4 text-right w-28">Points</th>
              <th scope="col" class="py-3.5 px-3 w-12 text-center">Detail</th>
            </tr>
          </thead>
          <tbody id="ranking-table-body" class="divide-y divide-neutral-200 text-sm">
            <tr>
              <td colspan="5" class="py-12 text-center text-neutral-500 font-mono text-xs">
                データを読み込み中...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 補足情報 -->
    <div class="mt-4 flex flex-col sm:flex-row justify-between text-xs text-neutral-500 font-mono gap-2">
      <div>* 選手行または右端の [+] をクリックすると大会別ポイント内訳を展開できます。</div>
      <div>Source: Freeride World Tour / Liveheats</div>
    </div>

  </main>

  <!-- フッター -->
  <footer class="border-t border-neutral-200 py-6 mt-12 bg-neutral-50">
    <div class="max-w-6xl mx-auto px-4 text-center text-xs text-neutral-500 font-mono">
      &copy; JAPAN FREERIDE. ALL RIGHTS RESERVED.
    </div>
  </footer>

  <script>
    let rankingsData = null;
    let currentCategory = 'ski_men';

    document.addEventListener('DOMContentLoaded', () => {
      fetchRankings();
    });

    async function fetchRankings() {
      try {
        const response = await fetch('rankings.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('rankings.json の取得失敗');
        rankingsData = await response.json();
        document.getElementById('last-updated').textContent = rankingsData.lastUpdated || '不明';
        renderRankings(currentCategory);
      } catch (error) {
        console.error(error);
        document.getElementById('ranking-table-body').innerHTML = `
          <tr>
            <td colspan="5" class="py-12 text-center text-brand font-mono text-xs">
              データの取得に失敗しました。
            </td>
          </tr>
        `;
      }
    }

    function changeCategory(categoryKey) {
      currentCategory = categoryKey;
      renderRankings(categoryKey);
    }

    function toggleDetail(index) {
      const detailRow = document.getElementById(`detail-${index}`);
      const icon = document.getElementById(`icon-${index}`);
      if (!detailRow) return;

      if (detailRow.classList.contains('hidden')) {
        detailRow.classList.remove('hidden');
        if (icon) icon.textContent = '−';
      } else {
        detailRow.classList.add('hidden');
        if (icon) icon.textContent = '+';
      }
    }

    function renderRankings(categoryKey) {
      if (!rankingsData || !rankingsData.categories) return;

      const allTabs = document.querySelectorAll('.tab-btn');
      allTabs.forEach(tab => {
        tab.className = "tab-btn px-4 py-3 text-xs sm:text-sm font-bold tracking-wider uppercase border border-black transition-colors text-center bg-white text-black hover:bg-neutral-100";
      });

      const activeTab = document.getElementById(`tab-${categoryKey}`);
      if (activeTab) {
        activeTab.className = "tab-btn px-4 py-3 text-xs sm:text-sm font-bold tracking-wider uppercase border border-black transition-colors text-center bg-brand text-white";
      }

      const category = rankingsData.categories[categoryKey];
      const tbody = document.getElementById('ranking-table-body');

      if (!category || !category.athletes || category.athletes.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-12 text-center text-neutral-400 font-mono text-xs uppercase tracking-wider">
              登録データがありません
            </td>
          </tr>
        `;
        return;
      }

      let html = '';
      category.athletes.forEach((athlete, idx) => {
        const isTop = athlete.japanRank === 1;
        const rowBg = isTop ? 'bg-neutral-50' : 'hover:bg-neutral-50';

        const avatar = athlete.image
          ? `<img src="${athlete.image}" alt="${athlete.name}" class="w-8 h-8 object-cover bg-neutral-200 border border-neutral-300 flex-shrink-0" onerror="this.style.display='none'">`
          : `<div class="w-8 h-8 bg-neutral-200 border border-neutral-300 flex items-center justify-center text-neutral-500 text-xs font-mono flex-shrink-0">JP</div>`;

        // 大会別ブレイクダウンのHTML生成
        const breakdownItems = (athlete.breakdown && athlete.breakdown.length > 0)
          ? athlete.breakdown.map(b => {
              const countStyle = b.counted ? 'text-neutral-900 font-bold' : 'text-neutral-400 line-through';
              return `
                <div class="flex items-center justify-between py-1.5 px-3 border-b border-neutral-200 text-xs font-mono">
                  <div class="truncate pr-4 flex-1 text-neutral-700">
                    ${b.eventName}
                  </div>
                  <div class="w-16 text-center text-neutral-500 tabular-nums">
                    ${b.place ? b.place + '位' : '-'}
                  </div>
                  <div class="w-24 text-right tabular-nums ${countStyle}">
                    ${Number(b.points || 0).toLocaleString()} pts
                  </div>
                </div>
              `;
            }).join('')
          : '<div class="py-2 px-3 text-neutral-400 text-xs font-mono">大会内訳データはありません</div>';

        // 選手行
        html += `
          <tr onclick="toggleDetail(${idx})" class="${rowBg} transition-colors cursor-pointer select-none">
            <td class="py-3 px-4 text-center font-mono font-bold text-base tabular-nums ${isTop ? 'text-brand' : 'text-neutral-900'}">
              ${athlete.japanRank}
            </td>
            <td class="py-3 px-4 text-center font-mono text-neutral-500 text-sm tabular-nums">
              ${athlete.worldRank ? athlete.worldRank : '-'}
            </td>
            <td class="py-3 px-4">
              <div class="flex items-center gap-3">
                ${avatar}
                <div class="font-bold text-neutral-900 tracking-tight truncate">${athlete.name}</div>
              </div>
            </td>
            <td class="py-3 px-4 text-right font-mono font-bold text-neutral-900 tabular-nums">
              ${Number(athlete.points || 0).toLocaleString()} <span class="text-[10px] font-normal text-neutral-500">pts</span>
            </td>
            <td class="py-3 px-3 text-center font-mono text-neutral-400 hover:text-black">
              <span id="icon-${idx}" class="text-sm font-bold">+</span>
            </td>
          </tr>

          <!-- アコーディオン内訳行（初期状態は非表示） -->
          <tr id="detail-${idx}" class="hidden bg-neutral-100 border-b border-neutral-300">
            <td colspan="5" class="p-3 sm:px-8">
              <div class="bg-white border border-neutral-300">
                <div class="bg-neutral-200 px-3 py-1 text-[11px] font-mono text-neutral-600 uppercase tracking-wider flex justify-between">
                  <span>Event / Contest</span>
                  <div class="flex gap-4">
                    <span class="w-16 text-center">Result</span>
                    <span class="w-24 text-right">Points</span>
                  </div>
                </div>
                ${breakdownItems}
              </div>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }
  </script>
</body>
</html>
