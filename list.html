<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EARTH HOPPER - 購入・発券</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .shine-effect::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-20deg);
      animation: shine 6s infinite;
    }
    @keyframes shine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }
  </style>
</head>
<body class="bg-[#f4f9ff] text-slate-800 antialiased flex justify-center">

  <div class="w-full max-w-md bg-[#f4f9ff] min-h-screen relative overflow-x-hidden no-scrollbar pb-20">

    <div class="px-5 pt-6 pb-6">

      <div class="bg-white/80 backdrop-blur-sm border border-sky-100 rounded-xl p-3 flex justify-between items-start divide-x divide-sky-100 shadow-sm mb-6">
        <div class="flex-1 px-1 flex flex-col items-center text-center">
          <svg class="w-4 h-4 text-blue-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span class="text-[10px] font-bold text-slate-700 leading-tight">年2回まで<br><span class="text-[8px] text-slate-400 font-semibold">1施設につき</span></span>
        </div>
        <div class="flex-1 px-1 flex flex-col items-center text-center">
          <svg class="w-4 h-4 text-blue-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span class="text-[10px] font-bold text-slate-700 leading-tight">当日のみ有効<br><span class="text-[8px] text-slate-400 font-semibold">現地で即発券</span></span>
        </div>
        <div class="flex-1 px-1 flex flex-col items-center text-center">
          <svg class="w-4 h-4 text-blue-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
          <span class="text-[10px] font-bold text-slate-700 leading-tight">窓口価格準拠<br><span class="text-[8px] text-slate-400 font-semibold">※一部除く</span></span>
        </div>
      </div>

      <div class="flex items-center gap-3 mb-5">
        
        <a href="#" class="relative flex-1 bg-white border border-blue-200 rounded-full py-3.5 px-4 shadow-sm hover:bg-sky-50 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 text-blue-600">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
          <span class="text-[13px] font-bold">保有チケット</span>
        </a>

        <a href="#" class="relative flex-1 bg-gradient-to-r from-sky-400 to-blue-500 rounded-full py-3.5 px-4 shadow-md hover:shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 text-white overflow-hidden shine-effect">
          <svg class="w-5 h-5 shrink-0 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
          <span class="text-[13px] font-bold relative z-10">マップで探す</span>
        </a>
      </div>

      <section>
        <h2 class="text-[15px] font-bold text-slate-800 flex items-center gap-2 mb-3">
          <span class="bg-teal-100 text-teal-600 p-1 rounded-md">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          </span>
          施設一覧
        </h2>

        <div class="space-y-2 mb-4">
          <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-0.5">
            <button class="shrink-0 bg-blue-600 text-white border border-blue-600 px-3.5 py-1.5 rounded-full text-[11px] font-bold shadow-sm">SNOW</button>
            <button class="shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full text-[11px] font-bold">SURF</button>
            <button class="shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full text-[11px] font-bold">SUP</button>
            <button class="shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full text-[11px] font-bold">MTB</button>
            <button class="shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full text-[11px] font-bold">CLIMB</button>
          </div>
          <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-0.5">
            <button class="shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full text-[11px] font-bold">北海道</button>
            <button class="shrink-0 bg-slate-800 text-white border border-slate-800 px-3.5 py-1.5 rounded-full text-[11px] font-bold shadow-sm">東北</button>
            <button class="shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full text-[11px] font-bold">関東</button>
            <button class="shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full text-[11px] font-bold">甲信越</button>
            <button class="shrink-0 bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full text-[11px] font-bold">西日本</button>
          </div>
        </div>

        <div class="bg-white border-2 border-dashed border-slate-200 rounded-2xl h-64 flex flex-col items-center justify-center text-slate-400 font-semibold shadow-sm">
          ここにスキー場リストを配置
        </div>
      </section>

    </div>
  </div>
</body>
</html>
