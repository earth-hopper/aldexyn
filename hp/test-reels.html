    (function initSnowAnimation() {
      const canvas = document.getElementById('snow-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      let width = 0, height = 0, flakes = [];

      function createFlake(randomY = false) {
        const fg = Math.random() < 0.25;
        return {
          x: Math.random() * (width || window.innerWidth),
          y: randomY ? Math.random() * (height || window.innerHeight) : -12,
          r: fg ? (Math.random() * 2.8 + 3.2) : (Math.random() * 1.8 + 1.5),
          speedY: fg ? (Math.random() * 0.7 + 0.6) : (Math.random() * 0.4 + 0.3),
          swayAmp: fg ? 0.5 : 0.25,
          swaySpeed: Math.random() * 0.015 + 0.006,
          phase: Math.random() * Math.PI * 2,
          alpha: fg ? 0.85 : 0.55
        };
      }

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        const count = Math.min(90, Math.max(50, Math.floor(width / 16)));
        flakes = Array.from({ length: count }, () => createFlake(true));
      }

      function render() {
        if (window.innerWidth >= 1024) {
          ctx.clearRect(0, 0, width, height);
          for (const f of flakes) {
            f.phase += f.swaySpeed;
            f.y += f.speedY;
            f.x += Math.sin(f.phase) * f.swayAmp;
            if (f.y > height + 12) Object.assign(f, createFlake(false));
            if (f.x > width + 12) f.x = -12;
            if (f.x < -12) f.x = width + 12;

            ctx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        requestAnimationFrame(render);
      }

      window.addEventListener('resize', resize);
      resize();
      render();
    })();

    function hashString(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h);
    }

    function getPhotoForResort(resortName) {
      return SNOW_PHOTOS[hashString(resortName) % SNOW_PHOTOS.length];
    }

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderStars(rate) {
      const n = Math.max(1, Math.min(5, Number(rate) || 5));
      return '★'.repeat(n) + '<span class="text-white/25">' + '★'.repeat(5 - n) + '</span>';

      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
      }, duration);

          return {
            id: `r_${hashString(resort + '::' + review).toString(36)}`,
            resort,
            rate: Number(item.rate) || 5,
            tags: String(item.tag || '').split(',').map(t => t.trim()).filter(Boolean),
            review
          };
        });

      let shuffled = shuffleArray(cleaned);

      const params = new URLSearchParams(window.location.search);
      const targetId = params.get('r');
      const targetResort = params.get('resort');

      if (targetId) {
        const idx = shuffled.findIndex(item => item.id === targetId);
        if (idx > 0) {
          const [targetItem] = shuffled.splice(idx, 1);
          shuffled.unshift(targetItem);
        } else if (idx === -1 && targetResort) {
          const rIdx = shuffled.findIndex(item => item.resort === targetResort);
          if (rIdx > 0) {
            const [targetItem] = shuffled.splice(rIdx, 1);
            shuffled.unshift(targetItem);
          }
        }
      } else if (targetResort) {
        const rIdx = shuffled.findIndex(item => item.resort === targetResort);
        if (rIdx > 0) {
          const [targetItem] = shuffled.splice(rIdx, 1);
          shuffled.unshift(targetItem);
        }
      }

      allReviews = shuffled;
      renderTagBar();
      applyFilter('すべて');
    }

    // ------------------------------------------------------------------
    // 4. タグピル描画（軽やかで邪魔にならないデザイン）
    // ------------------------------------------------------------------
    function renderTagBar() {
      const tagSet = new Set();
      allReviews.forEach(r => r.tags.forEach(t => tagSet.add(t)));
      const tags = ['すべて', ...Array.from(tagSet)];

      tagBar.innerHTML = tags.map(tag => {
        const isActive = activeTag === tag;
        return `
          <button
            data-tag="${escapeHtml(tag)}"
            class="tag-chip shrink-0 px-3 py-1 rounded-full text-xs font-bold tracking-wide transition-colors border ${
              isActive
                ? 'bg-white text-slate-900 border-white shadow-sm'
                : 'bg-black/40 text-white/85 border-white/15 hover:bg-black/60'
            }">
            #${escapeHtml(tag)}
          </button>
        `;
      }).join('');
    }

    function applyFilter(tag) {
      activeTag = tag;
      renderTagBar();
      filteredReviews = tag === 'すべて'
        ? [...allReviews]
        : allReviews.filter(r => r.tags.includes(tag));
      renderFeed();
    }

    // ------------------------------------------------------------------
    // 5. エディトリアル・ストーリーカード（広告臭を排した新しい雪山スタイルの提案）
    // ------------------------------------------------------------------
    function buildEditorialStoryHtml(lastResortName, photoUrl) {
      const safeResort = escapeHtml(lastResortName || '気になるゲレンデ');
      return `
        <section class="reel-slide story-slide relative w-full h-full snap-start snap-always overflow-hidden flex flex-col justify-between">
          <img src="${photoUrl}" alt="" loading="lazy" class="bg-photo absolute inset-0 w-full h-full object-cover object-center scale-105 pointer-events-none" />
          <div class="editorial-scrim absolute inset-0 pointer-events-none"></div>

          <!-- 上部：控えめなセクションラベル -->
          <div class="relative z-20 pt-28 px-6">
            <p class="font-eng text-[11px] font-bold tracking-[0.22em] text-sky-300 uppercase">
              NEW STYLE OF SKIING
            </p>
          </div>

          <!-- 中央：共感を呼ぶストーリーコピー -->
          <div class="relative z-20 px-6 my-auto">

            </p>

            <!-- 3つの事実を静かに整列 -->
            <div class="flex items-center gap-4 pt-4 border-t border-white/15 text-xs">
              <div>
                <span class="block text-white/50 text-[10px]">登録・年会費</span>
                <span class="font-bold text-white">ずっと 0円</span>
              </div>
              <div class="w-px h-6 bg-white/15"></div>
              <div>
                <span class="block text-white/50 text-[10px]">対象ゲレンデ</span>
                <span class="font-bold text-white">全国 約50施設</span>
              </div>
              <div class="w-px h-6 bg-white/15"></div>
              <div>
                <span class="block text-white/50 text-[10px]">チケット発券</span>
                <span class="font-bold text-white">当日LINEで即完了</span>

          </div>

          <!-- 下部アクション：押し売り感のない洗練された2ボタン -->
          <div class="relative z-20 px-6 safe-bottom pt-3 space-y-2.5">
            <a href="${LINE_URL}" target="_blank" rel="noopener noreferrer"

              <span class="w-6 h-6 rounded-full bg-line flex items-center justify-center shrink-0">
                <svg class="w-3.5 h-3.5 fill-white" viewBox="0 0 24 24">
                  <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63h-1.401v.866h1.401c.349 0 .63.283.63.63 0 .346-.281.63-.63.63h-2.032a.632.632 0 0 1-.631-.63V7.086c0-.348.282-.63.631-.63h2.032c.349 0 .63.282.63.63 0 .348-.281.63-.63.63h-1.401v.881h1.401zm-5.228 2.757h-.01a.631.631 0 0 1-.502-.25l-2.003-2.673v2.292c0 .348-.282.63-.63.63a.632.632 0 0 1-.631-.63V7.086c0-.348.282-.63.63-.63.218 0 .412.112.524.283l1.986 2.646V7.086c0-.348.282-.63.63-.63a.632.632 0 0 1 .631.63v5.534a.631.631 0 0 1-.625.63zm-5.617 0a.632.632 0 0 1-.631-.63V7.086c0-.348.282-.63.631-.63a.632.632 0 0 1 .63.63v5.534a.632.632 0 0 1-.63.63zm-2.479 0H4.01a.632.632 0 0 1-.631-.63V7.086c0-.348.282-.63.631-.63a.632.632 0 0 1 .63.63v4.903h2.031c.349 0 .63.283.63.63 0 .346-.281.63-.63.63zM24 10.614c0-5.304-5.378-9.614-12-9.614S0 5.31 0 10.614c0 4.754 4.264 8.72 10.027 9.475.39.084.922.258 1.057.592.122.303.079.778.039 1.085l-.171 1.027c-.053.303-.242 1.186 1.039.647 1.281-.54 6.911-4.069 9.428-6.967C23.068 14.708 24 12.77 24 10.614z"/>

            <a href="${HP_URL}" target="_blank" rel="noopener noreferrer"
               class="w-full h-12 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 text-white/85 font-bold text-[13px] flex items-center justify-center gap-1.5 transition-colors">
              <span>サービスについて</span>
              <svg class="w-3.5 h-3.5 text-white/60" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </a>
          </div>
        </section>
      `;
    }

    // ------------------------------------------------------------------
    // 6. フィード描画：主役は「スキー場のリアルな口コミ」
    // ------------------------------------------------------------------
    function renderFeed() {
      const slidesHtml = [];

      filteredReviews.forEach((item, idx) => {
        const isLong = item.review.length > 98 || (item.review.match(/\n/g) || []).length >= 3;
        const photoUrl = getPhotoForResort(item.resort);
        const isFirstSlide = idx === 0;

        // 初回のみ表示される控えめなスワイプ促進キュー
        const swipeCueHtml = (isFirstSlide && !hasSwipedOnce) ? `
          <div id="swipe-guide" class="pointer-events-none absolute top-[23%] left-1/2 -translate-x-1/2 z-30 transition-opacity duration-500">
            <div class="animate-swipe-cue flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-black/45 border border-white/15 text-white/90">
              <span class="text-[11px] font-medium tracking-wider">上にスワイプで次のゲレンデ</span>
              <svg class="w-3.5 h-3.5 text-white/75" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
        ` : '';

        slidesHtml.push(`
          <section
            data-review-index="${idx}"
            data-id="${escapeHtml(item.id)}"
            class="reel-slide review-slide relative w-full h-full snap-start snap-always overflow-hidden flex flex-col justify-end">

            <!-- 背景写真 -->
            <img
              src="${photoUrl}"
              alt="${escapeHtml(item.resort)}"
              loading="${idx < 3 ? 'eager' : 'lazy'}"
              decoding="async"
              class="bg-photo absolute inset-0 w-full h-full object-cover object-center pointer-events-none" />

            <!-- シネマティック・ビネット -->
            <div class="cinematic-scrim absolute inset-0 pointer-events-none"></div>

            ${swipeCueHtml}

            <!-- コンテンツエリア：エディトリアルな余白とタイポグラフィ -->
            <div class="relative z-20 w-full px-6 safe-bottom pt-8 flex flex-col">

              <!-- ゲレンデタイトル＆評価 -->
              <div class="mb-2.5">
                <div class="flex items-center gap-2 mb-1.5">
                  <span class="text-amber-400 text-xs tracking-widest">${renderStars(item.rate)}</span>
                  <span class="font-eng text-xs font-semibold text-white/80">${item.rate}.0</span>
                </div>
                <h2 class="text-[26px] sm:text-[28px] font-black leading-[1.26] text-white tracking-tight">
                  ${escapeHtml(item.resort)}
                </h2>
              </div>

              <!-- 特徴タグ -->
              ${item.tags.length > 0 ? `
                <div class="flex flex-wrap gap-1.5 mb-4">
                  ${item.tags.map(t => `
                    <button
                      data-tag="${escapeHtml(t)}"
                      class="inline-tag px-2.5 py-0.5 rounded-full bg-white/12 hover:bg-white/25 border border-white/15 text-[11px] font-medium text-white/90 transition-colors">
                      #${escapeHtml(t)}
                    </button>
                  `).join('')}
                </div>
              ` : ''}

              <!-- スキーヤーのリアルボイス（最も読みやすく美しく） -->
              <div class="mb-5">
                <p class="review-body text-[18px] sm:text-[19px] leading-[1.78] font-normal text-white/95 whitespace-pre-line ${isLong ? 'clamp-review' : ''}">${escapeHtml(item.review)}</p>
                ${isLong ? `
                  <button class="expand-btn mt-1.5 text-xs font-bold text-white/70 hover:text-white transition-colors">
                    続きを読む
                  </button>
                ` : ''}
              </div>

              <!-- セールス感を排した、軽やかなアクションドック -->
              <div class="flex items-center gap-2.5 pt-3 border-t border-white/12">
                <a
                  href="${LINE_URL}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="flex-1 min-w-0 h-12 px-4 rounded-2xl bg-white/14 hover:bg-white/22 border border-white/20 text-white flex items-center justify-between gap-2 transition-all active:scale-[0.98]">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <span class="w-6 h-6 rounded-full bg-line flex items-center justify-center shrink-0 shadow-sm">
                      <svg class="w-3.5 h-3.5 fill-white" viewBox="0 0 24 24">
                        <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63h-1.401v.866h1.401c.349 0 .63.283.63.63 0 .346-.281.63-.63.63h-2.032a.632.632 0 0 1-.631-.63V7.086c0-.348.282-.63.631-.63h2.032c.349 0 .63.282.63.63 0 .348-.281.63-.63.63h-1.401v.881h1.401zm-5.228 2.757h-.01a.631.631 0 0 1-.502-.25l-2.003-2.673v2.292c0 .348-.282.63-.63.63a.632.632 0 0 1-.631-.63V7.086c0-.348.282-.63.63-.63.218 0 .412.112.524.283l1.986 2.646V7.086c0-.348.282-.63.63-.63a.632.632 0 0 1 .631.63v5.534a.631.631 0 0 1-.625.63zm-5.617 0a.632.632 0 0 1-.631-.63V7.086c0-.348.282-.63.631-.63a.632.632 0 0 1 .63.63v5.534a.632.632 0 0 1-.63.63zm-2.479 0H4.01a.632.632 0 0 1-.631-.63V7.086c0-.348.282-.63.631-.63a.632.632 0 0 1 .63.63v4.903h2.031c.349 0 .63.283.63.63 0 .346-.281.63-.63.63zM24 10.614c0-5.304-5.378-9.614-12-9.614S0 5.31 0 10.614c0 4.754 4.264 8.72 10.027 9.475.39.084.922.258 1.057.592.122.303.079.778.039 1.085l-.171 1.027c-.053.303-.242 1.186 1.039.647 1.281-.54 6.911-4.069 9.428-6.967C23.068 14.708 24 12.77 24 10.614z"/>
                      </svg>
                    </span>
                    <span class="text-[13px] font-bold tracking-tight truncate">LINEでリフト券を見る</span>
                  </div>
                  <svg class="w-4 h-4 text-white/60 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                  </svg>
                </a>

                <!-- Xシェアボタン -->
                <button
                  data-action="share"
                  data-review-index="${idx}"
                  aria-label="Xで共有"
                  class="w-12 h-12 shrink-0 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/15 text-white/90 flex items-center justify-center transition-all active:scale-95">
                  <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                  </svg>
                </button>
              </div>

            </div>
          </section>
        `);

        // ストーリーカードをリズムよく挿入
        const currentCount = idx + 1;
        const shouldInsertStory =
          currentCount === FIRST_STORY_AT ||
          (currentCount > FIRST_STORY_AT && (currentCount - FIRST_STORY_AT) % STORY_INTERVAL === 0);

        if (shouldInsertStory && idx < filteredReviews.length - 1) {
          slidesHtml.push(buildEditorialStoryHtml(item.resort, photoUrl));
        }
      });

      feedContainer.innerHTML = slidesHtml.join('');
      feedContainer.scrollTop = 0;
      updateCounter(0);
      observeSlides();
    }

    // ------------------------------------------------------------------
    // 7. X共有＆インタラクション制御
    // ------------------------------------------------------------------
    function buildShareUrl(item) {
      try {
        const url = new URL(window.location.href);
        url.search = '';
        url.hash = '';
        url.searchParams.set('r', item.id);
        url.searchParams.set('resort', item.resort);
        return url.toString();
      } catch (e) {
        return `https://www.hopper.earth/reels/?r=${encodeURIComponent(item.id)}&resort=${encodeURIComponent(item.resort)}`;
      }
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function shareToX(item) {
      const shareUrl = buildShareUrl(item);
      const footer = `\n@earth_hopper\n#Earthhopper Reels\n${shareUrl}`;
      const header = `${item.resort}\n`;
      const fixedVisualLen = header.length + 2 + (`\n@earth_hopper\n#Earthhopper Reels\n`).length + 14;
      const maxReviewLen = Math.max(25, 136 - fixedVisualLen);

      let body = item.review.replace(/\n+/g, ' ');
      if (body.length > maxReviewLen) {
        body = body.slice(0, maxReviewLen - 1) + '…';
      }

      const tweetText = `${header}"${body}"${footer}`;
      const encoded = encodeURIComponent(tweetText);
      const webIntentUrl = `https://x.com/intent/tweet?text=${encoded}`;

      const ua = navigator.userAgent || '';
      const isLineInApp = /Line\//i.test(ua);
      const isMobile = /iPhone|iPad|iPod|Android/i.test(ua);

      await copyToClipboard(tweetText);

      if (isLineInApp || isMobile) {
        const appSchemeUrl = `twitter://post?message=${encoded}`;
        let appOpened = false;

        const onVisibilityChange = () => {
          if (document.hidden) appOpened = true;
        };
        document.addEventListener('visibilitychange', onVisibilityChange, { once: true });

        window.location.href = appSchemeUrl;

        setTimeout(() => {
          document.removeEventListener('visibilitychange', onVisibilityChange);
          if (!appOpened && !document.hidden) {
            if (isLineInApp) {
              showToast('投稿文をコピーしました。右上のメニューから「ブラウザで開く」でも投稿できます', '📋', 4000);
            }
            window.open(webIntentUrl, '_blank', 'noopener,noreferrer');
          }
        }, 650);
      } else {
        window.open(webIntentUrl, '_blank', 'noopener,noreferrer');
      }
    }

    function dismissSwipeGuide() {
      if (hasSwipedOnce) return;
      hasSwipedOnce = true;
      const guide = document.getElementById('swipe-guide');
      if (guide) {
        guide.style.opacity = '0';
        setTimeout(() => guide.remove(), 500);
      }
    }

    function updateCounter(reviewIndex) {
      if (activeTag === 'すべて') {
        counterPill.classList.add('hidden');
        return;
      }
      const total = filteredReviews.length;
      if (total > 0) {
        counterPill.classList.remove('hidden');
        counterPill.textContent = `${reviewIndex + 1} / ${total}`;
      } else {
        counterPill.classList.add('hidden');
      }
    }

    let slideObserver;
    function observeSlides() {
      if (slideObserver) slideObserver.disconnect();
      const slides = feedContainer.querySelectorAll('.reel-slide');

      slideObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            slides.forEach(s => s.classList.remove('active-slide'));
            entry.target.classList.add('active-slide');

            if (entry.target.dataset.reviewIndex !== undefined) {
              const rIdx = Number(entry.target.dataset.reviewIndex);
              if (rIdx > 0) dismissSwipeGuide();
              updateCounter(rIdx);
            } else {
              counterPill.classList.add('hidden');
            }
          }
        });
      }, { root: feedContainer, threshold: 0.65 });

      slides.forEach(s => slideObserver.observe(s));
    }

    tagBar.addEventListener('click', (e) => {
      const chip = e.target.closest('.tag-chip');
      if (chip) applyFilter(chip.dataset.tag);
    });

    feedContainer.addEventListener('click', (e) => {
      const shareBtn = e.target.closest('[data-action="share"]');
      if (shareBtn) {
        const item = filteredReviews[Number(shareBtn.dataset.reviewIndex)];
        if (item) shareToX(item);
        return;
      }

      const inlineTag = e.target.closest('.inline-tag');
      if (inlineTag) {
        applyFilter(inlineTag.dataset.tag);
        return;
      }

      const expandBtn = e.target.closest('.expand-btn');
      if (expandBtn) {
        const p = expandBtn.previousElementSibling;
        const expanded = !p.classList.contains('clamp-review');
        p.classList.toggle('clamp-review', expanded);
        expandBtn.textContent = expanded ? '続きを読む' : '閉じる';
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        dismissSwipeGuide();
        const h = feedContainer.clientHeight;
        const totalSlides = feedContainer.querySelectorAll('.reel-slide').length;
        if (totalSlides === 0) return;
        const current = Math.round(feedContainer.scrollTop / h);
        const next = e.key === 'ArrowDown'
          ? (current + 1) % totalSlides
          : (current - 1 + totalSlides) % totalSlides;
        feedContainer.scrollTo({ top: next * h, behavior: 'smooth' });
      }
    });

    let touchStartY = 0;
    feedContainer.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    feedContainer.addEventListener('touchend', (e) => {
      const diffY = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(diffY) > 15) dismissSwipeGuide();
      const atBottom = feedContainer.scrollTop + feedContainer.clientHeight >= feedContainer.scrollHeight - 8;
      if (atBottom && diffY > 50 && filteredReviews.length > 1) {
        feedContainer.scrollTo({ top: 0, behavior: 'auto' });
      }
    }, { passive: true });

    init();
  </script>
