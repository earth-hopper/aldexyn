<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SNOW REELS | ゲレンデ口コミ 縦スワイプ閲覧アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', '"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
          },
          keyframes: {
            slowZoom: {
              '0%': { transform: 'scale(1)' },
              '100%': { transform: 'scale(1.08)' },
            },
            popHeart: {
              '0%': { transform: 'scale(0.6)', opacity: '0' },
              '40%': { transform: 'scale(1.25)', opacity: '1' },
              '100%': { transform: 'scale(1)', opacity: '0' },
            },
            bounceSubtle: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            }
          },
          animation: {
            'slow-zoom': 'slowZoom 14s ease-out forwards',
            'pop-heart': 'popHeart 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'bounce-subtle': 'bounceSubtle 2.2s infinite ease-in-out',
          }
        }
      }
    };
  </script>
  <style>
    /* スクロールバー非表示（スマホ・デスクトップ両対応） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 100dvh対応 & スムーズスクロールスナップ */
    html, body {
      height: 100dvh;
      overflow: hidden;
      background-color: #060b14;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    .feed-container {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }
    .feed-card {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    /* レビューテキストの行数制限 */
    .line-clamp-4-custom {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="text-white antialiased selection:bg-sky-500 selection:text-white flex items-center justify-center relative">

  <!-- デスクトップ用背景の雪山アンビエント演出 -->
  <div class="hidden sm:block fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-32 -left-32 w-[500px] h-[500px] rounded-full bg-sky-500/10 blur-[120px]"></div>
    <div class="absolute -bottom-32 -right-32 w-[520px] h-[520px] rounded-full bg-indigo-500/10 blur-[130px]"></div>
    <div class="absolute top-6 left-8 flex items-center gap-3 text-white/60">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-white font-display font-extrabold shadow-lg shadow-sky-500/20">
        ❄
      </div>
      <div>
        <p class="font-display font-extrabold text-sm tracking-wider text-white/90">SNOW REELS</p>
        <p class="text-[11px] text-white/50">全国スキー場 リアル口コミフィード (242件)</p>
      </div>
    </div>
    <div class="absolute bottom-6 left-8 text-xs text-white/40 space-y-1">
      <p>↑↓ キー または マウスホイールでスワイプ</p>
      <p>ダブルタップで「行きたい！」保存</p>
    </div>
  </div>

  <!-- メインスマートフォンフレーム（モバイルは全画面、PCは中央スマホ枠） -->
  <main class="relative w-full h-[100dvh] sm:w-[420px] sm:h-[92dvh] sm:max-h-[880px] sm:rounded-[2.4rem] sm:border sm:border-white/15 sm:shadow-[0_25px_80px_-15px_rgba(0,0,0,0.85)] bg-slate-950 overflow-hidden flex flex-col">

    <!-- 上部オーバーレイヘッダー＆タグフィルター -->
    <header class="absolute top-0 inset-x-0 z-30 pt-3 sm:pt-4 px-3.5 pb-2 bg-gradient-to-b from-black/80 via-black/45 to-transparent pointer-events-none">
      <!-- トップバー -->
      <div class="flex items-center justify-between gap-2 pointer-events-auto">
        <div class="flex items-center gap-2">
          <button onclick="resetAllFilters()" class="flex items-center gap-1.5 bg-black/45 hover:bg-black/65 backdrop-blur-md border border-white/15 px-3 py-1.5 rounded-full transition active:scale-95">
            <span class="text-sky-400 text-sm">❄</span>
            <span class="font-display font-extrabold text-xs tracking-wider text-white">SNOW REELS</span>
          </button>
          <span id="counterBadge" class="text-[11px] font-display font-bold text-white/85 bg-white/15 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/10">
            1 / 242
          </span>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- スキー場検索ボタン -->
          <button onclick="openResortSearchModal()" title="スキー場を探す" class="flex items-center gap-1 bg-black/45 hover:bg-black/65 backdrop-blur-md border border-white/15 px-2.5 py-1.5 rounded-full text-xs font-medium text-white/90 transition active:scale-95">
            <svg class="w-3.5 h-3.5 text-sky-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <span class="hidden xs:inline">ゲレンデ</span>
          </button>

          <!-- シャッフルボタン -->
          <button onclick="shuffleFeed()" title="ランダム順にする" class="p-2 bg-black/45 hover:bg-black/65 backdrop-blur-md border border-white/15 rounded-full text-white/90 transition active:scale-95">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path>
            </svg>
          </button>

          <!-- 保存済み一覧ボタン -->
          <button onclick="openSavedModal()" title="保存した口コミ" class="relative p-2 bg-black/45 hover:bg-black/65 backdrop-blur-md border border-white/15 rounded-full text-white/90 transition active:scale-95">
            <svg class="w-3.5 h-3.5 text-amber-300" fill="currentColor" viewBox="0 0 24 24">
              <path d="M5 4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v17l-7-4-7 4V4z"></path>
            </svg>
            <span id="savedCountDot" class="hidden absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-rose-500 text-[10px] font-bold flex items-center justify-center">0</span>
          </button>
        </div>
      </div>

      <!-- スキー場絞り込み中のアクティブチップ -->
      <div id="activeResortBanner" class="hidden mt-2 pointer-events-auto">
        <div class="inline-flex items-center gap-2 bg-sky-500/90 backdrop-blur-md text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">
          <span>📍 <span id="activeResortName"></span> のみ表示中</span>
          <button onclick="clearResortFilter()" class="bg-black/25 hover:bg-black/40 rounded-full px-2 py-0.5 text-[10px] transition">
            解除 ✕
          </button>
        </div>
      </div>

      <!-- 横スクロール タグフィルターバー -->
      <div id="tagFilterBar" class="mt-2.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar pointer-events-auto pb-1">
        <!-- JSでタグボタンを動的生成 -->
      </div>
    </header>

    <!-- 縦スワイプ フィードコンテナ -->
    <div id="feedContainer" class="feed-container w-full h-full overflow-y-scroll no-scrollbar relative">
      <!-- JSでカードが動的にレンダリングされます -->
    </div>

    <!-- 初回スワイプヒント（下部中央・数秒後またはスクロールで消える） -->
    <div id="swipeHint" class="pointer-events-none absolute bottom-3 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center text-white/70 animate-bounce-subtle transition-opacity duration-500">
      <span class="text-[10px] font-medium tracking-widest uppercase bg-black/40 backdrop-blur-sm px-2.5 py-0.5 rounded-full border border-white/10">
        ↑ スワイプして次の口コミへ
      </span>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="pointer-events-none opacity-0 translate-y-2 transition-all duration-300 absolute top-28 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white text-xs font-semibold px-4 py-2.5 rounded-full border border-white/15 shadow-xl whitespace-nowrap">
      通知メッセージ
    </div>

    <!-- ボトムシート：スキー場別全口コミ一覧 -->
    <div id="resortSheetModal" class="hidden absolute inset-0 z-40 bg-black/70 backdrop-blur-sm flex flex-col justify-end transition-opacity">
      <div class="bg-slate-900 border-t border-white/15 rounded-t-3xl max-h-[82%] flex flex-col shadow-2xl overflow-hidden">
        <div class="p-4 border-b border-white/10 flex items-center justify-between">
          <div>
            <p class="text-[11px] text-sky-400 font-bold tracking-wider">SKI RESORT REVIEWS</p>
            <h3 id="sheetResortTitle" class="text-base font-extrabold text-white mt-0.5">スキー場名</h3>
            <div id="sheetResortStats" class="flex items-center gap-2 text-xs text-white/70 mt-1"></div>
          </div>
          <div class="flex items-center gap-2">
            <button id="sheetFilterOnlyBtn" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-full transition">
              フィードで絞る
            </button>
            <button onclick="closeResortSheet()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white/80">
              ✕
            </button>
          </div>
        </div>
        <div id="sheetReviewsList" class="p-4 overflow-y-auto space-y-3 no-scrollbar">
          <!-- スキー場の全レビュー一覧 -->
        </div>
      </div>
    </div>

    <!-- モーダル：スキー場検索＆一覧 -->
    <div id="searchModal" class="hidden absolute inset-0 z-40 bg-slate-950/95 backdrop-blur-xl flex flex-col">
      <div class="p-4 border-b border-white/10 flex items-center gap-2">
        <div class="relative flex-1">
          <input id="resortSearchInput" type="text" placeholder="スキー場名で検索（例：たんばら、ニセコ、白馬...）"
            class="w-full bg-white/10 border border-white/15 rounded-full pl-9 pr-4 py-2 text-sm text-white placeholder-white/40 focus:outline-none focus:border-sky-400" />
          <svg class="w-4 h-4 text-white/50 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </div>
        <button onclick="closeResortSearchModal()" class="text-xs font-bold text-white/75 hover:text-white px-2.5 py-2">
          閉じる
        </button>
      </div>
      <div class="px-4 py-2.5 bg-white/5 border-b border-white/10 flex items-center justify-between text-xs text-white/60">
        <span>全 <strong id="totalResortsCount" class="text-white">0</strong> スキー場 / 242 口コミ</span>
        <button onclick="resetAllFilters(); closeResortSearchModal();" class="text-sky-400 font-semibold hover:underline">
          すべて表示に戻す
        </button>
      </div>
      <div id="resortDirectoryList" class="flex-1 overflow-y-auto p-3 space-y-1.5 no-scrollbar">
        <!-- スキー場リスト -->
      </div>
    </div>

    <!-- モーダル：保存したお気に入り口コミ -->
    <div id="savedModal" class="hidden absolute inset-0 z-40 bg-slate-950/95 backdrop-blur-xl flex flex-col">
      <div class="p-4 border-b border-white/10 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-amber-400 text-lg">★</span>
          <h3 class="font-extrabold text-base">保存したゲレンデ口コミ</h3>
        </div>
        <button onclick="closeSavedModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm">
          ✕
        </button>
      </div>
      <div id="savedListContainer" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar">
        <!-- 保存済み一覧 -->
      </div>
    </div>

  </main>

  <!-- デスクトップ用：フレーム右側の前後ナビゲーションボタン -->
  <div class="hidden sm:flex flex-col gap-3 ml-5 z-20">
    <button onclick="navigateFeed(-1)" title="前の口コミ (↑)" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 backdrop-blur-md flex items-center justify-center text-white transition active:scale-90 shadow-lg">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"></path>
      </svg>
    </button>
    <button onclick="navigateFeed(1)" title="次の口コミ (↓)" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 backdrop-blur-md flex items-center justify-center text-white transition active:scale-90 shadow-lg">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
      </svg>
    </button>
  </div>

  <script>
    // ==========================================
    // 1. 全242件の実レビューデータ（CSVより完全収録）
    // ==========================================
    const REVIEWS_DATA = [
      {"resort":"Asahi自然観スノーパーク","rate":2,"tag":"混雑少,キレイな施設","review":"規模は縮小で滑れる場所が少なくなってしまいました\n\n黙々と練習するなら良いかも"},
      {"resort":"あわすのスキー場","rate":3,"tag":"絶景ビュー,ゲレ食,混雑少","review":"小規模なゲレンデですが、とてもアットホームな温かい雰囲気のスキー場でした。ゲレンデサイドにも個人経営の飲食店があり、タコライスが絶品でした。"},
      {"resort":"かもい岳国際スキー場","rate":5,"tag":"初心者向け,混雑少","review":"天気が悪くコンディション悪い時に行ったので\nパーク回してましたが、めちゃくちゃ飛びやすかった。大きさも大きすぎず、角度もキツすぎず、まくられることもなく気持ちよく食べました。ポコじゃんもあるし、初心者でも滑りながら選んで食べる距離感でした。作り方が上手なんだと思います"},
      {"resort":"さっぽろばんけいスキー場","rate":2,"tag":"混雑少","review":"三月の頭だったのでコースは二つだけ、雪も禿げていて土色になっている箇所も…。\nそれで通常料金はキツイなと思いました。\nアースホッパーが無かったら行かなかったかもしれません。\n今度は雪がたくさんある時に行きたいと思います。\nアートなどのコンセプトは良かったと思います。"},
      {"resort":"たざわ湖スキー場","rate":5,"tag":"コース,パウダー,絶景ビュー","review":"雪質も良くて最高でした。また来たいと思うゲレンデです。"},
      {"resort":"たんばらスキーパーク","rate":3,"tag":"初心者向け,コスパ","review":"初心者向けコースが多い。スタッフが親切です。"},
      {"resort":"ちくさ高原スキー場","rate":3,"tag":"初心者向け,アクセス","review":"アクセスは急な上りやクネクネ道が無いので楽で安心\nコースはコンパクトなので迷わない逸れない\nツリーコースが出来たら嬉しいです"},
      {"resort":"つがいけマウンテンリゾート","rate":5,"tag":"コース","review":"試乗会で行きました　ゲレンデが大きくてよく滑れました！\nご飯も美味しくてよかったです　井口コーラも飲みました！"},
      {"resort":"ぴっぷスキー場","rate":5,"tag":"ゲレ食,コスパ,混雑少,キレイな施設","review":"アットホームなゲレンデで常連さんが色々教えてくれてとても暖かいスキー場でした😄施設もとてもキレイでした！"},
      {"resort":"みやぎ蔵王えぼしリゾート","rate":3,"tag":"上級者向け,コース","review":"都内からだと遠いので行く機会ありませんでしたが、ホッパーを機に滑りに行く事になりました。コースバリエーションが思ったより多くて良かったです。"},
      {"resort":"アライマウンテンリゾート","rate":4,"tag":"上級者向け,パウダー,コース,温泉・宿","review":"アライはやはり、非圧雪エリア！降雪日は最高の雪を堪能出来ます。"},
      {"resort":"オグナほたかスキー場","rate":4,"tag":"パウダー","review":"良質のパウダーを楽しめました！\n新しくオープンしたコースではツリーランも楽しめるし、降雪のあとは最高です！\nただ、リフトにカバーがついてないので、寒さ対策は万全に"},
      {"resort":"カムイスキーリンクス","rate":5,"tag":"初心者向け,上級者向け,パウダー,コース,アクセス","review":"超ロングランでとても楽しめました！パウダーも軽くパウダー初心者から上級者でも楽しめると思いました。"},
      {"resort":"キャンモアスキービレッジ","rate":4,"tag":"初心者向け,アクセス","review":"旭川空港から近いのが最大のメリット！\n北海道遠征の最初の滑り出しに最適！"},
      {"resort":"キューピットバレイ","rate":3,"tag":"混雑少","review":"人が少なくて滑りやすかった！\nメインのクワッドリフトがオープンしたら、もっと楽しいんだろうな〜"},
      {"resort":"グランデコ スノーリゾート","rate":4,"tag":"初心者向け,上級者向け,パウダー,コース,キレイな施設","review":"ゴンドラで上まで行けるし、コースも初心者でも楽しめる！\n上級者には33°の壁を滑ってもらいたい！\n帰りには、センターハウスにあるクレープで決まりだね！"},
      {"resort":"スカイバレイスキー場","rate":4,"tag":"混雑少,コスパ,初心者向け","review":"比較的空いていて、雪質も安定している。\nコースも地形で遊びやすい。"},
      {"resort":"ニセコアンヌプリ国際スキー場","rate":5,"tag":"上級者向け,初心者向け,パウダー,絶景ビュー,コース,混雑少","review":"好きなスキー場で何度も行ってます！\n最高のパウダー、広いバーン、本当に大好きです！"},
      {"resort":"ニノックススノーパーク","rate":3,"tag":"コース,初心者向け","review":"緩斜面が広く、スノーボードを始めたい方や始めたばかりでこれからどんどん練習したい方にはとても滑りやすいゲレンデです！"},
      {"resort":"ハチ高原スキー場・ハチ北高原スキー場","rate":4,"tag":"コース","review":"関西最大級のゲレンデで、他のスキー場が雪不足の中でも滑れるコース数が豊富で、1日中楽しむことができました！上級者と初級者の混ざった大人数のグループで行っても楽しめます！\nアクセス路も高速道路のICからきれいに除雪された道で行きやすいのも魅力的です。来シーズンも滑りに行きたいです！"},
      {"resort":"パルコール嬬恋スキーリゾート","rate":4,"tag":"コース,絶景ビュー,混雑少","review":"雪質やコース、パークは素晴らしく、混雑もほぼなし。\n遠いこと、レストランの質に目をつぶれば非常に良いゲレンデ。"},
      {"resort":"ホワイトワールド尾瀬岩鞍","rate":5,"tag":"パウダー,コース","review":"コース幅が広くストレスフリーで滑れるゲレンデ\nロングコースも楽しめてゴンドラ降りてからの絶景を見てからの滑走はテンション上がります！"},
      {"resort":"ムイカスノーリゾート","rate":4,"tag":"上級者向け,初心者向け,パウダー,絶景ビュー,アクセス,コスパ","review":"寒波が来たときに行ったのでフワフワパウダースノーでとても良かったです。\n斜度が急なコースはないしコースも広いので練習するにはとても良いと思います。"},
      {"resort":"丸沼高原スキー場","rate":4,"tag":"上級者向け,初心者向け,ゲレ食,キレイな施設","review":"練習したいならバイオレットコースかおすすめ。12月のシーズン初めからGWまで幅広の中斜面が滑走できます。\n家族や仲間とワイワイ楽しむならゴンドラ使って山頂からのしらねコース〜ローズコース。ただローズコース後半は急なので要注意です。\n個人的には廃止になったゴールドコースの復活を願っています。\nまた夏期間のサマーリージュもおすすめです。"},
      {"resort":"会津高原たかつえスキー場","rate":3,"tag":"上級者向け","review":"グラトリ向き！とてもいいゲレンデと思ったが都内からはアクセス良くない"},
      {"resort":"会津高原だいくらスキー場","rate":4,"tag":"初心者向け,上級者向け,パウダー,混雑少","review":"週末でも人が少なく雪質も良いので東京から通っています。なにしろ人が少ないのが最高です！"},
      {"resort":"会津高原南郷スキー場","rate":4,"tag":"上級者向け,パウダー,コース","review":"地形が楽しいのとゲレ食が良かった\n雪質もよくまた行こうと思う"},

      "https://images.unsplash.com/photo-1605540436563-5bca919ae766?auto=format&fit=crop&w=900&q=80", // スノーボード・ゲレンデ

      "https://images.unsplash.com/photo-1482867996988-29ec3aee816d?auto=format&fit=crop&w=900&q=80", // 樹氷・冬景色
      "https://images.unsplash.com/photo-1517639493569-5666a7b2f494?auto=format&fit=crop&w=900&q=80", // スキーヤー・パウダースプレー

      "https://images.unsplash.com/photo-1551698618-1dfe5d97d256?auto=format&fit=crop&w=900&q=80", // スキー・冬山
      "https://images.unsplash.com/photo-1548777123-e216912df7d8?auto=format&fit=crop&w=900&q=80", // ツリーラン・森林雪道
      "https://images.unsplash.com/photo-1516466723877-e4ec1d736c8a?auto=format&fit=crop&w=900&q=80", // 雪化粧のロッジ・リゾート
      "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=900&q=80", // 雄大な雪峰
      "https://images.unsplash.com/photo-1491002052546-bf38f186af56?auto=format&fit=crop&w=900&q=80", // 朝焼けの雪景色
      "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=80"  // ゲレンデ滑走シーン
    ];

    // スキー場名とインデックスから決定的に写真URLを取得
    function getPhotoForReview(review) {
      let hash = review.id * 7;
      for (let i = 0; i < review.resort.length; i++) {
        hash = (hash * 31 + review.resort.charCodeAt(i)) >>> 0;
      }
      return SKI_PHOTOS[hash % SKI_PHOTOS.length];
    }

    // ==========================================
    // 3. スキー場ごとの集計マップ作成
    // ==========================================
    const RESORT_STATS = {};
    REVIEWS_DATA.forEach(item => {
      if (!RESORT_STATS[item.resort]) {
        RESORT_STATS[item.resort] = { count: 0, totalRate: 0, reviews: [] };
      }
      RESORT_STATS[item.resort].count += 1;
      RESORT_STATS[item.resort].totalRate += item.rate;
      RESORT_STATS[item.resort].reviews.push(item);
    });
    Object.keys(RESORT_STATS).forEach(resort => {
      const s = RESORT_STATS[resort];
      s.avgRate = (s.totalRate / s.count).toFixed(1);
    });

    // ==========================================
    // 4. アプリ状態管理
    // ==========================================
    const ALL_TAGS = [
      "すべて", "パウダー", "初心者向け", "上級者向け", "絶景ビュー",
      "ゲレ食", "混雑少", "コスパ", "アクセス", "コース",
      "キレイな施設", "温泉・宿", "レンタル"
    ];

    let state = {
      selectedTag: "すべて",
      selectedResort: null,
      feedItems: [...REVIEWS_DATA],
      activeIndex: 0,
      likedIds: new Set(),
      savedIds: new Set(),
      isShuffled: false
    };

    const feedContainer = document.getElementById("feedContainer");
    const tagFilterBar = document.getElementById("tagFilterBar");
    const counterBadge = document.getElementById("counterBadge");

    // ==========================================
    // 5. タグフィルターバー描画
    // ==========================================
    function renderTagBar() {
      tagFilterBar.innerHTML = ALL_TAGS.map(tag => {
        const isActive = state.selectedTag === tag;
        const baseClass = "shrink-0 px-3 py-1 rounded-full text-xs font-bold transition-all cursor-pointer select-none border";
        const activeClass = isActive
          ? "bg-white text-slate-950 border-white shadow-md scale-[1.02]"
          : "bg-black/40 hover:bg-black/60 text-white/90 border-white/15 backdrop-blur-md";
        return `<button onclick="selectTag('${tag}')" class="${baseClass} ${activeClass}">${tag}</button>`;
      }).join("");
    }

    // ==========================================
    // 6. フィルタリング＆無限スワイプ用アイテム生成
    // ==========================================
    function applyFilters(resetScroll = true) {
      let filtered = REVIEWS_DATA.filter(item => {
        const matchTag = state.selectedTag === "すべて" || item.tag.split(",").includes(state.selectedTag);
        const matchResort = !state.selectedResort || item.resort === state.selectedResort;
        return matchTag && matchResort;
      });

      if (state.isShuffled) {
        filtered = [...filtered].sort(() => Math.random() - 0.5);
      }

      state.feedItems = filtered;
      state.activeIndex = 0;

      // スキー場絞り込みバナー表示制御
      const banner = document.getElementById("activeResortBanner");
      if (state.selectedResort) {
        banner.classList.remove("hidden");
        document.getElementById("activeResortName").textContent = state.selectedResort;
      } else {
        banner.classList.add("hidden");
      }

      renderFeed();
      if (resetScroll) {
        feedContainer.scrollTop = 0;
      }
      updateCounter();
    }

    function selectTag(tag) {
      state.selectedTag = tag;
      renderTagBar();
      applyFilters(true);
    }

    function filterByResort(resortName) {
      state.selectedResort = resortName;
      closeResortSheet();
      closeResortSearchModal();
      applyFilters(true);
      showToast(`📍 ${resortName} の口コミを表示中`);
    }

    function clearResortFilter() {
      state.selectedResort = null;
      applyFilters(true);
    }

    function resetAllFilters() {
      state.selectedTag = "すべて";
      state.selectedResort = null;
      state.isShuffled = false;
      renderTagBar();
      applyFilters(true);
      showToast("すべての口コミ（242件）を表示します");
    }

    function shuffleFeed() {
      state.isShuffled = true;
      applyFilters(true);
      showToast("🔀 口コミをシャッフルしました");
    }

    // ==========================================
    // 7. フィードカードのHTML生成（TikTok風UI）
    // ==========================================
    function createCardHTML(item, listIndex) {
      const photoUrl = getPhotoForReview(item);
      const tags = item.tag ? item.tag.split(",").filter(Boolean) : [];
      const stats = RESORT_STATS[item.resort];
      const isLiked = state.likedIds.has(item.id);
      const isSaved = state.savedIds.has(item.id);
      const likeCount = item.baseLikes + (isLiked ? 1 : 0);
      const isLongReview = item.review.length > 105 || (item.review.match(/\n/g) || []).length >= 3;

      // 星評価の生成
      const starsHTML = Array.from({ length: 5 }, (_, i) => {
        const filled = i < item.rate;
        return `<span class="${filled ? 'text-amber-400' : 'text-white/25'} text-sm">★</span>`;
      }).join("");

      // タグピルの生成
      const tagsHTML = tags.map(t => `
        <button onclick="event.stopPropagation(); selectTag('${t}')"
          class="bg-white/15 hover:bg-white/30 active:scale-95 backdrop-blur-md border border-white/20 text-white text-[11px] font-semibold px-2.5 py-0.5 rounded-full transition">
          #${t}
        </button>
      `).join("");

      const resortInitial = item.resort.replace(/[^ぁ-んァ-ン一-龥A-Za-z]/g, "").slice(0, 1) || "❄";

      return `
        <section data-index="${listIndex}" data-id="${item.id}"
          ondblclick="handleDoubleTap(event, ${item.id})"
          class="feed-card relative w-full h-full bg-slate-900 overflow-hidden select-none">

          <!-- 背景写真 + 緩やかなズームアニメーション -->
          <img src="${photoUrl}" alt="${item.resort}" loading="${listIndex < 3 ? 'eager' : 'lazy'}"
            onerror="this.style.display='none'"
            class="card-bg-img absolute inset-0 w-full h-full object-cover object-center transition-transform duration-700" />

          <!-- フォールバック＆視認性確保用マルチストップ・グラデーション -->
          <div class="absolute inset-0 bg-gradient-to-br from-sky-950/40 via-transparent to-slate-950/60 pointer-events-none"></div>
          <div class="absolute inset-x-0 bottom-0 h-[68%] bg-gradient-to-t from-black/95 via-black/60 to-transparent pointer-events-none"></div>

          <!-- ダブルタップ時のハートエフェクト用コンテナ -->
          <div class="double-tap-heart pointer-events-none absolute inset-0 flex items-center justify-center z-20"></div>

          <!-- 右側 TikTokスタイル アクションレール -->
          <div class="absolute right-3 bottom-7 z-20 flex flex-col items-center gap-4">
            <!-- スキー場アバター（タップでスキー場詳細シート） -->
            <button onclick="openResortSheet('${item.resort.replace(/'/g, "\\'")}')"
              class="relative group flex flex-col items-center">
              <div class="w-11 h-11 rounded-full bg-gradient-to-br from-sky-400 to-indigo-600 p-0.5 shadow-lg">
                <div class="w-full h-full rounded-full bg-slate-900/90 flex items-center justify-center font-extrabold text-sm text-white">
                  ${resortInitial}
                </div>
              </div>
              <span class="mt-1 text-[10px] font-bold text-white/90 bg-black/50 backdrop-blur-sm px-1.5 py-0.2 rounded-full">
                ${stats.count}件
              </span>
            </button>

            <!-- 行きたい / いいねボタン -->
            <button onclick="toggleLike(${item.id}, this)" class="flex flex-col items-center gap-1 group">
              <div class="w-11 h-11 rounded-full bg-black/40 hover:bg-black/60 backdrop-blur-md border border-white/15 flex items-center justify-center transition active:scale-125">
                <svg class="like-icon w-6 h-6 transition-colors ${isLiked ? 'text-rose-500 fill-rose-500' : 'text-white fill-none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                </svg>
              </div>
              <span class="like-count text-[11px] font-display font-bold text-white drop-shadow">${likeCount}</span>
            </button>

            <!-- お気に入り保存ボタン -->
            <button onclick="toggleSave(${item.id}, this)" class="flex flex-col items-center gap-1">
              <div class="w-11 h-11 rounded-full bg-black/40 hover:bg-black/60 backdrop-blur-md border border-white/15 flex items-center justify-center transition active:scale-125">
                <svg class="save-icon w-5 h-5 transition-colors ${isSaved ? 'text-amber-400 fill-amber-400' : 'text-white fill-none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v17l-7-4-7 4V4z" />
                </svg>
              </div>
              <span class="text-[10px] font-bold text-white/90 drop-shadow">${isSaved ? '保存済' : '保存'}</span>
            </button>

            <!-- 全口コミ一覧ボトムシートボタン -->
            <button onclick="openResortSheet('${item.resort.replace(/'/g, "\\'")}')" class="flex flex-col items-center gap-1">
              <div class="w-11 h-11 rounded-full bg-black/40 hover:bg-black/60 backdrop-blur-md border border-white/15 flex items-center justify-center transition active:scale-110">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
              </div>
              <span class="text-[10px] font-bold text-white/90 drop-shadow">一覧</span>
            </button>

            <!-- シェアボタン -->
            <button onclick="shareReview(${item.id})" class="flex flex-col items-center gap-1">
              <div class="w-11 h-11 rounded-full bg-black/40 hover:bg-black/60 backdrop-blur-md border border-white/15 flex items-center justify-center transition active:scale-110">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" />
                </svg>
              </div>
              <span class="text-[10px] font-bold text-white/90 drop-shadow">共有</span>
            </button>
          </div>

          <!-- 左下 メインオーバーレイコンテンツ（スキー場名・評価・タグ・レビュー本文） -->
          <div class="absolute left-4 right-16 bottom-6 z-20 flex flex-col items-start">
            <!-- スキー場名バッジ（タップでそのスキー場の全口コミシート表示） -->
            <button onclick="openResortSheet('${item.resort.replace(/'/g, "\\'")}')"
              class="group text-left mb-1.5 flex items-start gap-1.5">
              <span class="text-sky-400 text-lg leading-tight mt-0.5">📍</span>
              <div>
                <h2 class="text-xl sm:text-[22px] font-black leading-snug tracking-tight text-white drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)] group-hover:text-sky-300 transition">
                  ${item.resort}
                </h2>
                <div class="flex items-center gap-2 mt-0.5">
                  <div class="flex items-center gap-0.5 bg-black/45 backdrop-blur-md px-2 py-0.5 rounded-full border border-white/10">
                    ${starsHTML}
                    <span class="ml-1 text-xs font-display font-extrabold text-amber-300">${item.rate}.0</span>
                  </div>
                  <span class="text-[11px] text-white/75 font-medium">
                    平均 ★${stats.avgRate} (${stats.count}件) ›
                  </span>
                </div>
              </div>
            </button>

            <!-- タグ一覧 -->
            <div class="flex flex-wrap gap-1.5 my-2">
              ${tagsHTML}
            </div>

            <!-- レビュー本文（長文は4行クランプ＋続きを読むトグル） -->
            <div class="review-box w-full rounded-2xl transition-all duration-200">
              <p id="review-text-${listIndex}" class="text-sm sm:text-[15px] leading-relaxed text-white/95 whitespace-pre-line drop-shadow-[0_1px_4px_rgba(0,0,0,0.9)] ${isLongReview ? 'line-clamp-4-custom' : ''}">${escapeHTML(item.review)}</p>
              ${isLongReview ? `
                <button onclick="toggleExpandReview(${listIndex}, this)"
                  class="mt-1.5 inline-flex items-center gap-1 text-xs font-bold text-sky-300 hover:text-sky-200 bg-black/45 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/15">
                  続きを読む
                </button>
              ` : ''}
            </div>
          </div>
        </section>
      `;
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ==========================================
    // 8. フィード描画 & 無限ループ継ぎ足し
    // ==========================================
    function renderFeed() {
      if (state.feedItems.length === 0) {
        feedContainer.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center p-8 text-center">
            <p class="text-4xl mb-3">🎿</p>
            <p class="text-base font-bold text-white">条件に一致する口コミがありません</p>
            <p class="text-xs text-white/60 mt-1 mb-5">別のタグやスキー場を選択してみてください</p>
            <button onclick="resetAllFilters()" class="bg-sky-500 text-slate-950 font-bold text-xs px-5 py-2.5 rounded-full">
              すべての口コミを表示
            </button>
          </div>
        `;
        return;
      }

      // 初期バッチ描画（最大40件ずつ追加して超軽量維持）
      const initialBatch = state.feedItems.slice(0, 40);
      feedContainer.innerHTML = initialBatch.map((item, idx) => createCardHTML(item, idx)).join("");
      activateCardZoom(0);
    }

    // スクロール位置に応じて追加バッチ・無限ループ用カードを追加
    function appendMoreCardsIfNeeded(currentIdx) {
      const totalRendered = feedContainer.querySelectorAll(".feed-card").length;
      if (totalRendered - currentIdx <= 6 && state.feedItems.length > 0) {
        const fragment = document.createDocumentFragment();
        const temp = document.createElement("div");
        for (let i = 0; i < 20; i++) {
          const nextIdx = totalRendered + i;
          // 末尾に達したら先頭へシームレスに循環（エンドレススワイプ体験）
          const item = state.feedItems[nextIdx % state.feedItems.length];
          temp.innerHTML = createCardHTML(item, nextIdx);
          fragment.appendChild(temp.firstElementChild);
        }
        feedContainer.appendChild(fragment);
      }
    }

    // アクティブカードの背景にゆっくりズームアニメーションを付与
    function activateCardZoom(index) {
      const cards = feedContainer.querySelectorAll(".feed-card");
      cards.forEach((card, i) => {
        const img = card.querySelector(".card-bg-img");
        if (!img) return;
        if (i === index) {
          img.classList.add("animate-slow-zoom");
        } else {
          img.classList.remove("animate-slow-zoom");
        }
      });
    }

    function updateCounter() {
      if (state.feedItems.length === 0) {
        counterBadge.textContent = "0 / 0";
        return;
      }
      const displayNum = (state.activeIndex % state.feedItems.length) + 1;
      counterBadge.textContent = `${displayNum} / ${state.feedItems.length}`;
    }

    // スクロール監視（現在表示中のカードを特定）
    let scrollTimeout;
    feedContainer.addEventListener("scroll", () => {
      const hint = document.getElementById("swipeHint");
      if (hint && !hint.classList.contains("opacity-0")) {
        hint.classList.add("opacity-0");
      }

      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        const cardHeight = feedContainer.clientHeight;
        if (cardHeight === 0) return;
        const newIndex = Math.round(feedContainer.scrollTop / cardHeight);
        if (newIndex !== state.activeIndex) {
          state.activeIndex = newIndex;
          updateCounter();
          activateCardZoom(newIndex);
          appendMoreCardsIfNeeded(newIndex);
        }
      }, 60);
    }, { passive: true });

    // 上下ナビゲーション（ボタン・キーボード矢印）
    function navigateFeed(direction) {
      const cardHeight = feedContainer.clientHeight;
      const targetIndex = Math.max(0, state.activeIndex + direction);
      appendMoreCardsIfNeeded(targetIndex);
      feedContainer.scrollTo({
        top: targetIndex * cardHeight,
        behavior: "smooth"
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        navigateFeed(1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        navigateFeed(-1);
      }
    });

    // ==========================================
    // 9. カード内インタラクション（続きを読む・いいね・保存・共有）
    // ==========================================
    function toggleExpandReview(listIndex, btn) {
      const textEl = document.getElementById(`review-text-${listIndex}`);
      const boxEl = textEl.parentElement;
      const isClamped = textEl.classList.contains("line-clamp-4-custom");
      if (isClamped) {
        textEl.classList.remove("line-clamp-4-custom");
        boxEl.classList.add("bg-black/65", "backdrop-blur-md", "p-3", "border", "border-white/15");
        btn.textContent = "閉じる ▲";
      } else {
        textEl.classList.add("line-clamp-4-custom");
        boxEl.classList.remove("bg-black/65", "backdrop-blur-md", "p-3", "border", "border-white/15");
        btn.textContent = "続きを読む";
      }
    }

    function toggleLike(id, btnEl) {
      if (state.likedIds.has(id)) {
        state.likedIds.delete(id);
      } else {
        state.likedIds.add(id);
        showToast("❤️「行きたい！」リストに追加しました");
      }
      syncCardActionStates(id);
    }

    function handleDoubleTap(event, id) {
      const card = event.currentTarget;
      const heartLayer = card.querySelector(".double-tap-heart");
      heartLayer.innerHTML = `
        <svg class="w-24 h-24 text-rose-500 fill-rose-500 drop-shadow-[0_0_25px_rgba(244,63,94,0.8)] animate-pop-heart" viewBox="0 0 24 24">
          <path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      `;
      if (!state.likedIds.has(id)) {
        state.likedIds.add(id);
        syncCardActionStates(id);
      }
    }

    function toggleSave(id) {
      if (state.savedIds.has(id)) {
        state.savedIds.delete(id);
        showToast("保存を解除しました");
      } else {
        state.savedIds.add(id);
        showToast("🔖 口コミを保存しました");
      }
      syncCardActionStates(id);
      updateSavedBadge();
    }

    function syncCardActionStates(id) {
      const item = REVIEWS_DATA.find(r => r.id === id);
      const isLiked = state.likedIds.has(id);
      const isSaved = state.savedIds.has(id);
      document.querySelectorAll(`.feed-card[data-id="${id}"]`).forEach(card => {
        const likeIcon = card.querySelector(".like-icon");
        const likeCount = card.querySelector(".like-count");
        const saveIcon = card.querySelector(".save-icon");
        if (likeIcon) {
          likeIcon.classList.toggle("text-rose-500", isLiked);
          likeIcon.classList.toggle("fill-rose-500", isLiked);
          likeIcon.classList.toggle("text-white", !isLiked);
          likeIcon.classList.toggle("fill-none", !isLiked);
        }
        if (likeCount) {
          likeCount.textContent = item.baseLikes + (isLiked ? 1 : 0);
        }
        if (saveIcon) {
          saveIcon.classList.toggle("text-amber-400", isSaved);
          saveIcon.classList.toggle("fill-amber-400", isSaved);
          saveIcon.classList.toggle("text-white", !isSaved);
          saveIcon.classList.toggle("fill-none", !isSaved);
        }
      });
    }

    function updateSavedBadge() {
      const dot = document.getElementById("savedCountDot");
      if (state.savedIds.size > 0) {
        dot.textContent = state.savedIds.size;
        dot.classList.remove("hidden");
      } else {
        dot.classList.add("hidden");
      }
    }

    function shareReview(id) {
      const item = REVIEWS_DATA.find(r => r.id === id);
      if (!item) return;
      const text = `【${item.resort}】★${item.rate}.0\n${item.review}\n#SNOWREELS #ゲレンデ口コミ`;
      const textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
        showToast("📋 口コミテキストをクリップボードにコピーしました");
      } catch (e) {
        showToast("シェア用リンクを準備しました");
      }
      document.body.removeChild(textarea);
    }

    // ==========================================
    // 10. ボトムシート & モーダル操作
    // ==========================================
    function openResortSheet(resortName) {
      const stats = RESORT_STATS[resortName];
      if (!stats) return;
      document.getElementById("sheetResortTitle").textContent = resortName;
      document.getElementById("sheetResortStats").innerHTML = `
        <span class="text-amber-400 font-bold">★ ${stats.avgRate}</span>
        <span>•</span>
        <span>全 ${stats.count} 件のリアル口コミ</span>
      `;
      document.getElementById("sheetFilterOnlyBtn").onclick = () => filterByResort(resortName);

      const listEl = document.getElementById("sheetReviewsList");
      listEl.innerHTML = stats.reviews.map(r => `
        <div class="bg-white/5 border border-white/10 rounded-2xl p-3.5">
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-1 text-amber-400 text-xs font-bold">
              ${"★".repeat(r.rate)}<span class="text-white/25">${"★".repeat(5 - r.rate)}</span>
              <span class="ml-1 text-white/80">${r.rate}.0</span>
            </div>
            <div class="flex flex-wrap gap-1 justify-end">
              ${r.tag.split(",").map(t => `<span class="text-[10px] bg-white/10 text-white/80 px-2 py-0.5 rounded-full">#${t}</span>`).join("")}
            </div>
          </div>
          <p class="text-xs sm:text-sm text-white/90 leading-relaxed whitespace-pre-line">${escapeHTML(r.review)}</p>
        </div>
      `).join("");

      document.getElementById("resortSheetModal").classList.remove("hidden");
    }

    function closeResortSheet() {
      document.getElementById("resortSheetModal").classList.add("hidden");
    }

    // スキー場検索モーダル
    function openResortSearchModal() {
      document.getElementById("searchModal").classList.remove("hidden");
      const input = document.getElementById("resortSearchInput");
      input.value = "";
      renderResortDirectory("");
      setTimeout(() => input.focus(), 100);
    }

    function closeResortSearchModal() {
      document.getElementById("searchModal").classList.add("hidden");
    }

    document.getElementById("resortSearchInput").addEventListener("input", (e) => {
      renderResortDirectory(e.target.value.trim());
    });

    function renderResortDirectory(query) {
      const resorts = Object.keys(RESORT_STATS)
        .filter(name => name.toLowerCase().includes(query.toLowerCase()))
        .sort((a, b) => RESORT_STATS[b].count - RESORT_STATS[a].count);

      document.getElementById("totalResortsCount").textContent = Object.keys(RESORT_STATS).length;

      const listEl = document.getElementById("resortDirectoryList");
      if (resorts.length === 0) {
        listEl.innerHTML = `<p class="text-center text-xs text-white/50 py-10">該当するスキー場が見つかりませんでした</p>`;
        return;
      }

      listEl.innerHTML = resorts.map(name => {
        const s = RESORT_STATS[name];
        return `
          <button onclick="filterByResort('${name.replace(/'/g, "\\'")}')"
            class="w-full flex items-center justify-between p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 transition text-left">
            <div>
              <p class="font-bold text-sm text-white">${name}</p>
              <p class="text-[11px] text-white/60 mt-0.5">平均 <span class="text-amber-400 font-bold">★${s.avgRate}</span></p>
            </div>
            <span class="bg-sky-500/20 text-sky-300 border border-sky-400/30 text-xs font-bold px-2.5 py-1 rounded-full">
              ${s.count}件 ›
            </span>
          </button>
        `;
      }).join("");
    }

    // 保存済み一覧モーダル
    function openSavedModal() {
      const container = document.getElementById("savedListContainer");
      const savedItems = REVIEWS_DATA.filter(r => state.savedIds.has(r.id));

      if (savedItems.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-white/50">
            <p class="text-3xl mb-2">🔖</p>
            <p class="text-sm font-bold text-white/80">まだ保存した口コミがありません</p>
            <p class="text-xs mt-1">右側の「保存」ボタンから気になったゲレンデをストックできます</p>
          </div>
        `;
      } else {
        container.innerHTML = savedItems.map(r => `
          <div class="bg-white/5 border border-white/10 rounded-2xl p-3.5">
            <div class="flex items-center justify-between mb-1">
              <button onclick="closeSavedModal(); filterByResort('${r.resort.replace(/'/g, "\\'")}')"
                class="font-extrabold text-sm text-sky-300 hover:underline text-left">
                📍 ${r.resort}
              </button>
              <button onclick="toggleSave(${r.id}); openSavedModal();" class="text-[11px] text-white/50 hover:text-rose-400">
                削除
              </button>
            </div>
            <div class="text-amber-400 text-xs mb-1.5">${"★".repeat(r.rate)} <span class="text-white/70">${r.rate}.0</span></div>
            <p class="text-xs text-white/90 leading-relaxed whitespace-pre-line">${escapeHTML(r.review)}</p>
          </div>
        `).join("");
      }

      document.getElementById("savedModal").classList.remove("hidden");
    }

    function closeSavedModal() {
      document.getElementById("savedModal").classList.add("hidden");
    }

    // トースト通知
    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.remove("opacity-0", "translate-y-2");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
      }, 2200);
    }

    // ==========================================
    // 11. 初期化実行
    // ==========================================
    window.addEventListener("DOMContentLoaded", () => {
      renderTagBar();
      applyFilters(true);
    });
  </script>
</body>
</html>
