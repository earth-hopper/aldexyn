<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club EARTH HOPPER - Missions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 滑らかなプログレスバーのアニメーション用 */
    .progress-bar { transition: width 1s ease-in-out; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-2 text-slate-800 font-sans">

  <!-- Mobile Screen Frame (Gamified Dark/Light Theme Mix) -->
  <div class="w-full max-w-sm bg-slate-50 rounded-2xl shadow-2xl overflow-hidden border border-slate-700 relative">

    <!-- Header -->
    <header class="px-4 py-3 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between sticky top-0 z-10">
      <button class="text-slate-500 hover:text-slate-800 transition">
        <i data-lucide="chevron-left" class="w-6 h-6"></i>
      </button>
      <span class="font-black text-sm text-slate-900 tracking-wider">MISSIONS</span>
      <div class="w-6"></div> <!-- バランス用ダミー -->
    </header>

    <main class="pb-6">
      
      <!-- Hero Section: User Status & Total Earned -->
      <div class="bg-slate-900 px-4 py-6 text-white rounded-b-[2rem] shadow-md relative overflow-hidden">
        <!-- 背景の装飾 -->
        <div class="absolute -right-10 -top-10 opacity-10">
          <i data-lucide="mountain" class="w-48 h-48"></i>
        </div>
        
        <div class="relative z-10 flex flex-col items-center text-center space-y-1">
          <span class="text-xs font-bold text-sky-400 tracking-widest uppercase">Current Rank</span>
          <h1 class="text-xl font-black text-white flex items-center gap-2">
            <i data-lucide="award" class="w-6 h-6 text-amber-400"></i>
            Gold Hopper
          </h1>
          
          <div class="mt-4 pt-4 border-t border-slate-700/50 w-full flex justify-center gap-6">
            <div>
              <span class="block text-[10px] text-slate-400 mb-1">ミッションで獲得したマイル</span>
              <div class="flex items-baseline justify-center gap-1">
                <span class="text-sm font-bold text-sky-400">m</span>
                <span class="text-2xl font-black tracking-tight">4,500</span>
              </div>
            </div>
            <div>
              <span class="block text-[10px] text-slate-400 mb-1">クリア済み</span>
              <div class="flex items-baseline justify-center gap-1">
                <span class="text-2xl font-black tracking-tight">8</span>
                <span class="text-sm font-bold text-slate-300">個</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mission List Section -->
      <div class="px-4 mt-6 space-y-4">
        <h2 class="text-xs font-black text-slate-400 tracking-widest pl-1">進行中・未達成のミッション</h2>

        <!-- Card 1: Ready to Claim (達成済み・未受取) -->
        <div class="bg-white rounded-xl p-4 border-2 border-amber-400 shadow-[0_0_15px_rgba(251,191,36,0.2)] relative overflow-hidden">
          <div class="absolute top-0 right-0 bg-amber-400 text-amber-950 text-[10px] font-black px-2 py-1 rounded-bl-lg">
            CLEAR!
          </div>
          <div class="flex gap-3">
            <div class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center shrink-0">
              <i data-lucide="map" class="w-6 h-6 text-amber-600"></i>
            </div>
            <div class="flex-1">
              <h3 class="font-bold text-slate-800 text-sm leading-tight mb-1">3つの異なる施設をホッピング</h3>
              <p class="text-[10px] text-slate-500 mb-2">色々なスキー場を楽しもう！</p>
              
              <!-- Progress -->
              <div class="flex justify-between items-end mb-1 text-[10px] font-bold">
                <span class="text-amber-600">3 / 3 施設</span>
                <span class="text-slate-400">100%</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-1.5 mb-3">
                <div class="bg-amber-400 h-1.5 rounded-full progress-bar" style="width: 100%"></div>
              </div>
              
              <!-- Claim Button -->
              <button class="w-full bg-gradient-to-r from-amber-400 to-orange-500 text-white font-bold text-xs py-2.5 rounded-lg shadow-md hover:scale-[1.02] active:scale-95 transition flex items-center justify-center gap-1.5 animate-pulse">
                <i data-lucide="coins" class="w-4 h-4"></i>
                1,000 マイルを受け取る
              </button>
            </div>
          </div>
        </div>

        <!-- Card 2: In Progress -->
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm relative">
          <div class="flex gap-3">
            <div class="w-12 h-12 rounded-full bg-sky-50 flex items-center justify-center shrink-0">
              <i data-lucide="snowflake" class="w-6 h-6 text-sky-500"></i>
            </div>
            <div class="flex-1">
              <div class="flex justify-between items-start">
                <h3 class="font-bold text-slate-800 text-sm leading-tight mb-1">北海道エリア制覇</h3>
                <span class="text-xs font-black text-sky-600 bg-sky-50 px-2 py-0.5 rounded flex items-center gap-0.5">
                  <i data-lucide="plus" class="w-3 h-3"></i>2,000m
                </span>
              </div>
              <p class="text-[10px] text-slate-500 mb-2">北海道内の対象施設を5つ回る</p>
              
              <!-- Progress -->
              <div class="flex justify-between items-end mb-1 text-[10px] font-bold">
                <span class="text-sky-600">2 / 5 施設</span>
                <span class="text-slate-400">40%</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-1.5">
                <div class="bg-sky-500 h-1.5 rounded-full progress-bar" style="width: 40%"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 3: In Progress (Just started) -->
        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm relative">
          <div class="flex gap-3">
            <div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center shrink-0">
              <i data-lucide="users" class="w-6 h-6 text-slate-400"></i>
            </div>
            <div class="flex-1">
              <div class="flex justify-between items-start">
                <h3 class="font-bold text-slate-800 text-sm leading-tight mb-1">仲間とホッピング</h3>
                <span class="text-xs font-black text-sky-600 bg-sky-50 px-2 py-0.5 rounded flex items-center gap-0.5">
                  <i data-lucide="plus" class="w-3 h-3"></i>500m
                </span>
              </div>
              <p class="text-[10px] text-slate-500 mb-2">友達を紹介して一緒に滑りに行く</p>
              
              <!-- Progress -->
              <div class="flex justify-between items-end mb-1 text-[10px] font-bold">
                <span class="text-slate-500">0 / 1 回</span>
                <span class="text-slate-400">0%</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-1.5">
                <div class="bg-sky-500 h-1.5 rounded-full progress-bar" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Completed Missions (Accordion for compactness) -->
      <div class="px-4 mt-6">
        <details class="group">
          <summary class="cursor-pointer flex items-center justify-between text-xs font-black text-slate-400 tracking-widest pl-1 list-none select-none">
            <span>達成済みミッション (8)</span>
            <i data-lucide="chevron-down" class="w-4 h-4 transition-transform group-open:rotate-180"></i>
          </summary>
          <div class="pt-3 space-y-2">
            <!-- Completed Card Mini -->
            <div class="bg-slate-50 rounded-lg p-3 border border-slate-100 flex items-center gap-3 opacity-70">
              <i data-lucide="check-circle-2" class="w-8 h-8 text-emerald-500"></i>
              <div>
                <h4 class="font-bold text-slate-700 text-xs">初めてのアースホッピング</h4>
                <p class="text-[10px] text-slate-500">獲得済: 500m</p>
              </div>
            </div>
            <div class="bg-slate-50 rounded-lg p-3 border border-slate-100 flex items-center gap-3 opacity-70">
              <i data-lucide="check-circle-2" class="w-8 h-8 text-emerald-500"></i>
              <div>
                <h4 class="font-bold text-slate-700 text-xs">アーリーバード（早割購入）</h4>
                <p class="text-[10px] text-slate-500">獲得済: 1,000m</p>
              </div>
            </div>
          </div>
        </details>
      </div>

    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
