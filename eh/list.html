<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>提携施設 | Earthhopper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ベースフォントサイズを16px(1rem)に設定し、視認性を向上 */
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; font-size: 16px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* モーダルのフェードアニメーション */
    .modal-enter { opacity: 0; transform: scale(0.95); transition: all 0.3s ease-out; }
    .modal-enter-active { opacity: 1; transform: scale(1); }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased flex justify-center">

  <div class="w-full max-w-md bg-[#f8fafc] min-h-screen relative overflow-x-hidden no-scrollbar pb-24 shadow-sm">

    <div class="px-5 pt-6 pb-6">

      <!-- 購入済みのチケット (タップしやすいようパディングを拡大) -->
      <a href="#" class="w-full bg-white border border-slate-200 rounded-xl py-4 px-5 shadow-sm hover:shadow active:scale-[0.98] transition-all duration-200 flex items-center justify-between mb-8 group min-h-[64px]">
        <div class="flex items-center gap-3.5">
          <div class="bg-blue-50 text-blue-600 p-2.5 rounded-lg group-hover:bg-blue-100 transition-colors">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
          </div>
          <span class="text-base font-bold text-slate-800">購入済みのチケット</span>
        </div>
        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </a>

      <section>
        <!-- 見出しとマップボタン -->
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
            提携施設
          </h2>
          
          <a href="#" class="bg-slate-800 text-white rounded-full py-2 px-5 text-sm font-bold shadow-sm hover:bg-slate-700 active:scale-95 transition-all duration-200 flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
            マップ
          </a>
        </div>

        <!-- フィルタータグ (文字サイズをtext-smに引き上げ、押しやすく) -->
        <div class="space-y-3.5 mb-6">
          <div class="flex items-center space-x-2.5 overflow-x-auto no-scrollbar pb-1">
            <button class="shrink-0 bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-sm">SNOW</button>
            <button class="shrink-0 bg-white text-slate-700 border border-slate-300 px-5 py-2 rounded-full text-sm font-bold">SURF</button>
            <button class="shrink-0 bg-white text-slate-700 border border-slate-300 px-5 py-2 rounded-full text-sm font-bold">SUP</button>
            <button class="shrink-0 bg-white text-slate-700 border border-slate-300 px-5 py-2 rounded-full text-sm font-bold">MTB</button>
            <button class="shrink-0 bg-white text-slate-700 border border-slate-300 px-5 py-2 rounded-full text-sm font-bold">CLIMB</button>
          </div>
          <div class="flex items-center space-x-2.5 overflow-x-auto no-scrollbar pb-1">
            <button class="shrink-0 bg-white text-slate-700 border border-slate-300 px-5 py-2 rounded-full text-sm font-bold">北海道</button>
            <button class="shrink-0 bg-slate-800 text-white px-5 py-2 rounded-full text-sm font-bold shadow-sm">東北</button>
            <button class="shrink-0 bg-white text-slate-700 border border-slate-300 px-5 py-2 rounded-full text-sm font-bold">関東</button>
            <button class="shrink-0 bg-white text-slate-700 border border-slate-300 px-5 py-2 rounded-full text-sm font-bold">甲信越</button>
            <button class="shrink-0 bg-white text-slate-700 border border-slate-300 px-5 py-2 rounded-full text-sm font-bold">西日本</button>
          </div>
        </div>

        <!-- リストエリア -->
        <div class="bg-white border-2 border-dashed border-slate-300 rounded-2xl h-80 flex flex-col items-center justify-center text-slate-500 font-medium shadow-sm text-base">
          ここにスキー場リストを配置
        </div>
      </section>

    </div>
  </div>

  <!-- 注意事項モーダル -->
  <div id="noticeModal" class="fixed inset-0 z-50 flex items-center justify-center p-5 bg-slate-900/60 backdrop-blur-sm hidden">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6 sm:p-8 shadow-2xl modal-enter" id="modalContent">
      <h3 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
        <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        ご利用前の注意事項
      </h3>
      
      <ul class="space-y-6 mb-8 text-base">
        <li class="flex items-start gap-4">
          <span class="mt-1 bg-blue-50 text-blue-600 p-1.5 rounded-full shrink-0"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>
          <div>
            <strong class="text-slate-900 block mb-1 text-base">施設あたり年2回まで</strong>
            <span class="text-sm text-slate-600 leading-snug block">まだ知らないフィールドで遊ぼう🌏</span>
          </div>
        </li>
        <li class="flex items-start gap-4">
          <span class="mt-1 bg-blue-50 text-blue-600 p-1.5 rounded-full shrink-0"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>
          <div>
            <strong class="text-slate-900 block mb-1 text-base">購入当日のみ有効</strong>
            <span class="text-sm text-slate-600 leading-snug block">天候や施設の営業時間をチェック✅</span>
          </div>
        </li>
        <li class="flex items-start gap-4">
          <span class="mt-1 bg-blue-50 text-blue-600 p-1.5 rounded-full shrink-0"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>
          <div>
            <strong class="text-slate-900 block mb-1 text-base">窓口公式価格に準拠</strong>
            <span class="text-sm text-slate-600 leading-snug block">そこから最大20%のマイルバック💰</span>
          </div>
        </li>
      </ul>

      <label class="flex items-center gap-3 mb-6 cursor-pointer p-2 -ml-2 rounded-lg hover:bg-slate-50 transition-colors">
        <input type="checkbox" id="dontShowAgain" class="w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
        <span class="text-base text-slate-600 font-medium">今後は表示しない</span>
      </label>

      <button id="closeModalBtn" class="w-full bg-slate-800 text-white text-base font-bold rounded-xl py-4 active:scale-[0.98] transition-transform shadow-md hover:shadow-lg">
        確認して閉じる
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.getElementById('noticeModal');
      const modalContent = document.getElementById('modalContent');
      const closeBtn = document.getElementById('closeModalBtn');
      const checkbox = document.getElementById('dontShowAgain');
      const STORAGE_KEY = 'earthhopper_hide_notice';

      // localStorageをチェックして表示判定
      if (localStorage.getItem(STORAGE_KEY) !== 'true') {
        modal.classList.remove('hidden');
        // 少し遅らせてアニメーションクラスを付与
        requestAnimationFrame(() => {
          modalContent.classList.add('modal-enter-active');
        });
      }

      // 閉じるボタンの処理
      closeBtn.addEventListener('click', () => {
        if (checkbox.checked) {
          localStorage.setItem(STORAGE_KEY, 'true');
        }
        
        // 閉じるアニメーション
        modalContent.classList.remove('modal-enter-active');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300);
      });
    });
  </script>
</body>
</html>
