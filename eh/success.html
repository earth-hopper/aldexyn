<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EARTH HOPPER - 手続き完了</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#0093d4',
            brandDark: '#006bb3',
            dark: '#1a1a1a',
            accent: '#f43f5e',
          },
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            eng: ['"Inter"', 'sans-serif'],
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'bounce-soft': 'bounceSoft 2s infinite',
            'shine': 'shine 3s infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceSoft: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            },
            shine: {
              '0%': { left: '-100%' },
              '20%': { left: '200%' },
              '100%': { left: '200%' }
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f4f7f9;
      color: #333;
      -webkit-font-smoothing: antialiased;
    }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* =========================
       Checkmark Animation
    ========================== */
    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: block;
      stroke-width: 3;
      stroke: #fff;
      stroke-miterlimit: 10;
      box-shadow: inset 0px 0px 0px #fff;
      animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
    }
    .checkmark__circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 3;
      stroke-miterlimit: 10;
      stroke: #fff;
      fill: none;
      animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }
    .checkmark__check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
    }
    @keyframes stroke {
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scale {
      0%, 100% { transform: none; }
      50% { transform: scale3d(1.1, 1.1, 1); }
    }
    @keyframes fill {
      100% { box-shadow: inset 0px 0px 0px 50px rgba(255,255,255,0.2); }
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    /* Animation Delays */
    .delay-100 { animation-delay: 100ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-500 { animation-delay: 500ms; }
    .delay-700 { animation-delay: 700ms; }
  </style>
</head>
<body class="flex justify-center">

  <div class="w-full max-w-md min-h-screen relative overflow-hidden bg-[#f4f7f9] shadow-2xl flex flex-col">
    
    <canvas id="confetti-canvas"></canvas>

    <!-- =========================
         1. HERO (SUCCESS STATUS)
    ========================== -->
    <div class="relative pt-16 pb-14 px-6 flex flex-col justify-center items-center bg-gradient-to-br from-brand via-sky-400 to-[#00b4d8] text-white overflow-hidden rounded-b-[40px] shadow-[0_12px_30px_rgba(0,147,212,0.15)] z-10">
      
      <!-- BG Orbs -->
      <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-20 rounded-full blur-3xl transform translate-x-1/3 -translate-y-1/3 pointer-events-none"></div>
      <div class="absolute bottom-0 left-0 w-48 h-48 bg-sky-200 opacity-20 rounded-full blur-2xl transform -translate-x-1/2 translate-y-1/2 pointer-events-none"></div>
      
      <!-- Animated Checkmark -->
      <div class="relative z-10 mb-6">
        <svg class="checkmark shadow-sm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
          <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
          <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
      </div>

      <!-- Success Message (汎用化) -->
      <div class="text-center relative z-10 opacity-0 animate-fade-in-up delay-300">
        <p class="font-eng text-sm font-bold tracking-widest text-sky-100 mb-2">REGISTRATION COMPLETE</p>
        <h1 class="text-[24px] font-black leading-tight drop-shadow-md mb-3">
          会員登録が<br>完了しました！
        </h1>
        <div class="inline-flex items-center gap-1.5 bg-white/20 px-4 py-2 rounded-full backdrop-blur-sm border border-white/30 shadow-sm">
          <svg class="w-4 h-4 text-yellow-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
          <span class="text-[13px] font-bold text-white">26-27シーズンの準備が整いました ⛄️</span>
        </div>
      </div>
    </div>

    <!-- =========================
         2. DETAILS & ACTION
    ========================== -->
    <div class="px-6 pt-10 pb-12 flex-1 flex flex-col relative">
      
      <!-- Community Stat -->
      <div class="text-center mb-8 opacity-0 animate-fade-in-up delay-500">
        <h2 class="text-xs font-bold text-gray-500 mb-2">現在のコミュニティメンバー</h2>
        <div class="flex justify-center items-baseline gap-1 mb-1">
          <span id="member-counter" class="font-eng text-[44px] font-black text-brand tracking-tighter leading-none">0</span>
          <span class="text-sm font-bold text-gray-500">人</span>
        </div>
        <p class="text-[12px] font-bold text-gray-400">
          の仲間が、次のシーズンを待っています。
        </p>
      </div>

      <!-- Ticket/Status Card (汎用化) -->
      <div class="bg-white rounded-2xl p-5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 mb-10 opacity-0 animate-fade-in-up delay-700 relative overflow-hidden">
        <div class="absolute left-0 top-0 w-1.5 h-full bg-brand"></div>
        <div class="flex items-center justify-between mb-3 border-b border-gray-50 pb-3">
          <p class="text-xs font-bold text-gray-400">会員ステータス</p>
          <span class="bg-blue-50 text-brand text-[10px] font-bold px-2 py-1 rounded">手続き完了</span>
        </div>
        
        <p class="text-xs font-bold text-gray-400 mb-1">会員期間</p>
        <p class="text-[15px] font-bold text-dark flex items-center gap-2">
          <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span id="dynamic-date">本日</span> <span class="text-gray-400 font-normal mx-1">〜</span> 2027年9月30日
        </p>
      </div>

      <!-- CTA Button (汎用化) -->
      <div class="mt-auto opacity-0 animate-fade-in-up" style="animation-delay: 900ms;">
        <a href="#" class="relative block w-full bg-dark text-white font-black text-[17px] py-4.5 rounded-2xl shadow-[0_8px_20px_rgba(0,0,0,0.15)] hover:bg-black hover:shadow-xl transition-all active:scale-[0.98] overflow-hidden group flex items-center justify-center gap-2 h-14">
          <!-- Button Shine Effect -->
          <div class="absolute top-0 -left-[100%] w-1/2 h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -skew-x-12 animate-shine"></div>
          
          マイページへ進む
          <svg class="w-5 h-5 text-brand animate-bounce-soft" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </a>
      </div>
      
    </div>
  </div>

  <!-- =========================
       SCRIPTS
  ========================== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Dynamic Date formatting
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth() + 1;
      const day = today.getDate();
      document.getElementById('dynamic-date').textContent = `${year}年${month}月${day}日`;

      // 2. Member Counter Animation (0 -> 9,876)
      const targetNumber = 9876;
      const counterElement = document.getElementById('member-counter');
      const duration = 2000;
      const frameRate = 30;
      const totalFrames = Math.round((duration / 1000) * frameRate);
      let frame = 0;

      // easeOutQuart
      const easeOut = (t) => 1 - Math.pow(1 - t, 4);

      setTimeout(() => {
        const counterInterval = setInterval(() => {
          frame++;
          const progress = easeOut(frame / totalFrames);
          const currentNumber = Math.round(targetNumber * progress);
          
          counterElement.textContent = currentNumber.toLocaleString();

          if (frame >= totalFrames) {
            clearInterval(counterInterval);
            counterElement.textContent = targetNumber.toLocaleString();
          }
        }, 1000 / frameRate);
      }, 500);

      // 3. Confetti Animation
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#ffffff', '#0093d4', '#4dd0e1', '#f43f5e', '#e0f2fe'];

      // Generate particles
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height * 0.35,
          r: Math.random() * 5 + 2,
          dx: Math.random() * 12 - 6,
          dy: Math.random() * -12 - 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncrement: (Math.random() * 0.07) + 0.05,
          tiltAngle: 0
        });
      }

      function drawConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let activeParticles = 0;
        
        particles.forEach((p) => {
          p.tiltAngle += p.tiltAngleIncrement;
          p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
          p.x += Math.sin(p.tiltAngle) * 2;
          p.dy += 0.25; // Gravity
          p.x += p.dx;
          p.y += p.dy;

          if (p.y <= canvas.height) {
            activeParticles++;
          }

          ctx.beginPath();
          ctx.lineWidth = p.r;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
          ctx.stroke();
        });

        if (activeParticles > 0) {
          requestAnimationFrame(drawConfetti);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      // Start confetti after checkmark animates
      setTimeout(() => {
        drawConfetti();
      }, 900);
      
      // Handle window resize for canvas
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    });
  </script>
</body>
</html>
